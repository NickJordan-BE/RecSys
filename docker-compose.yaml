services:
  candidate-gen-service:
    build: ./services/candidate-generation
    image: ${DOCKER_USERNAME}/recsys:candidate-gen-servicev1.0
    ports: 
      - ${CANDIDATE_GEN_SERVICE_PORT}:80
  orchestrator-service:
    build: ./services/orchestrator
    image: ${DOCKER_USERNAME}/recsys:spring-orchestrator-servicev1.0
    ports:
      - ${ORCHESTRATOR_SERVICE_PORT}:8080
  ranking-service:
    build: ./services/ranking
    image: ${DOCKER_USERNAME}/recsys:ranking-servicev1.0
    ports:
      - ${RANKING_SERVICE_PORT}:8080
  filtering-service:
    build: ./services/filtering
    image: ${DOCKER_USERNAME}/recsys:spring-filtering-servicev1.0
    ports:
      - ${FILTERING_SERVICE_PORT}:8080
  feature-store-service:
    build: ./services/feature-store
    image: ${DOCKER_USERNAME}/recsys:feature-store-servicev1.0
    ports:
      - ${FEATURE_STORE_SERVICE_PORT}:4000