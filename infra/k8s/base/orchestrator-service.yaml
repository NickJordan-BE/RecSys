apiVersion: v1
kind: Namespace
metadata:
  name: orchestrator-app
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-app
  namespace: orchestrator-app
  labels:
    app: orchestrator-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: orchestrator-app
  template:
    metadata:
      labels:
        app: orchestrator-app
    spec:
      imagePullSecrets:
        - name: dockerhub-auth
      containers:
      - name: orchestrator-app
        image: ${DOCKER_USERNAME}/recsys:spring-orchestrator-servicev1.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8080
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
