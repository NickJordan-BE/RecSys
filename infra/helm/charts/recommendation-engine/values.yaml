global:
  environment: dev
  servicePort: 80

orchestrator:
  serviceName: orchestrator-service
  namespaceOverride: orchestrator-app
  containerPort: 8080
  replicas: 1
  ingressClass: alb
  ingressPath: /api/recommendations
  imagePullSecrets: argocd-ecr-credentials
  deployment:
    enabled: true
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
  ingressAnnotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/type: external

candidate-generation:
  namespaceOverride: candidate-generation-app
  containerPort: 80
  replicas: 1
  imagePullSecrets: argocd-ecr-credentials
  deployment:
    enabled: true
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2


filtering:
  namespaceOverride: filtering-app
  containerPort: 8080
  replicas: 1
  imagePullSecrets: argocd-ecr-credentials
  deployment:
    enabled: true
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2


feature-store:
  namespaceOverride: feature-store-app
  containerPort: 4000
  replicas: 1
  imagePullSecrets: argocd-ecr-credentials
  deployment:
    enabled: true
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2


ranking:
  namespaceOverride: ranking-app
  containerPort: 8080
  replicas: 1
  imagePullSecrets: argocd-ecr-credentials
  deployment:
    enabled: true
  hpa:
    enabled: false
    minReplicas: 1
    maxReplicas: 2
